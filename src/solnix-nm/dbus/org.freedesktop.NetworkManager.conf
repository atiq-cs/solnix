<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- solnix-nm (services.solnix-nm): root owns the NetworkManager name; anyone may call it, as with NetworkManager's
     own policy. The daemon itself refuses changes (connect, forget, disconnect, the radio switch) from callers that are
     neither root nor in the networkmanager group. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
  <policy context="default">
    <deny own="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
