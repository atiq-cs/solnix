<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- solnix-power (services.solnix-power): root owns the UPower and UPower.PowerProfiles names; anyone may read them, as
     with upower's and power-profiles-daemon's own policies. The daemon refuses a profile change from a caller that is
     neither root nor in the seat group. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.UPower"/>
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.UPower"/>
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
  </policy>
</busconfig>
