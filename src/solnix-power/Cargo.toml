[package]
name = "solnix-power"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "org.freedesktop.UPower and org.freedesktop.UPower.PowerProfiles for COSMIC, over illumos acpi_drv kstats and power.conf"

[dependencies]
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync", "fs"] }

[profile.release]
debug = 1
