#
# nvidia_drm: one pseudo node, laid only by hardware.graphics.nvidia.drm.
# Its attach makes only the "ctl" minor (ddi_pseudo) and touches no GPU.
# site/solnix-nvidia starts nvidia-drm by opening
# /devices/pseudo/nvidia_drm@0:ctl (root only), after its guarded first probe:
# that registers a DRM device (card<N>, renderD<128+N>) for each GPU NVKMS
# reports. The GPU's NVKMS device exists only while a card/renderD file or a
# GEM object is open, so an idle dGPU can still power off (rtd3).
#
name="nvidia_drm" parent="pseudo" instance=0;
# The minor names count from here (/dev/dri/card<base>, renderD<128+base>):
# i915 is card0 and renderD128 on the X1E.
drm-card-base=1;
