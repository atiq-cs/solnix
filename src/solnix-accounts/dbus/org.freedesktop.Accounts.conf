<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- solnix-accounts (services.solnix-accounts): root owns org.freedesktop.Accounts and anyone may read it, as with
     accounts-daemon's own policy. The service is read-only: every method that would change an account answers
     org.freedesktop.Accounts.Error.NotSupported. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.Accounts"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.Accounts"/>
  </policy>
</busconfig>
