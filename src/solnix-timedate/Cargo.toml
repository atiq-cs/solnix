[package]
name = "solnix-timedate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "org.freedesktop.timedate1 for COSMIC Settings > Time & language, over the illumos zone files and /etc/default/init"

# the same dependency set as solnix-power (its Cargo.lock, renamed): the vendored crates are the same
[dependencies]
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync", "fs"] }

[profile.release]
debug = 1
