<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- solnix-timedate (services.solnix-timedate): root owns org.freedesktop.timedate1 and anyone may call it, as with
     systemd-timedated's policy. SetTimezone checks the caller itself: root or an RBAC administrator. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.timedate1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.timedate1"/>
  </policy>
</busconfig>
